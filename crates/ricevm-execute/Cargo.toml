[package]
name = "ricevm-execute"
description = "The execution engine and runtime for the RiceVM bytecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license.workspace = true

[features]
default = []
gui = ["sdl2"]
audio = ["cpal"]

[dependencies]
ricevm_core.workspace = true
ricevm_loader.workspace = true
tracing.workspace = true
colored.workspace = true
sdl2 = { version = "0.38.0", optional = true }
cpal = { workspace = true, optional = true }
md-5 = "0.11.0"
md4 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
