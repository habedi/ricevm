name: Run Linter Checks

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lints:
    runs-on: ubuntu-latest

    strategy:
      # One entry failing must not cancel the other, or a green run on
      # stable is reported as cancelled and its result is lost.
      fail-fast: false
      matrix:
        rust-version: [ "1.90.0", "stable" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust ${{ matrix.rust-version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}

      # `make lint` needs only clippy and the rustfmt its `format` prerequisite
      # runs. `make install-deps` would also build cargo-tarpaulin and friends
      # from source, which fails on the MSRV entry because those tools require a
      # newer compiler than this project does.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl pkg-config libssl-dev make
          rustup component add rustfmt clippy

      - name: Run linters
        run: make lint
