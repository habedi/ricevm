[package]
name = "ricevm-cli"
description = "The command line interface for RiceVM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license.workspace = true

[features]
default = []
gui = ["ricevm_execute/gui"]
audio = ["ricevm_execute/audio"]

[dependencies]
ricevm_core.workspace = true
ricevm_loader.workspace = true
ricevm_execute.workspace = true
ricevm_limbo = { path = "../ricevm-limbo", package = "ricevm-limbo" }
clap.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
